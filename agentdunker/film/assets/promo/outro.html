<script>
const W = 1920, H = 1080, DUR = 6.0;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const CYAN = '#3fe0ff', ORANGE = '#ff8a3d';

// ---------- helpers ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// ---------- camera / projection ----------
let CAM;
function setCam(t) {
  const k = easeInOut(prog(t, 0, 6));
  const az = lerp(0.50, 0.20, k);
  const dist = lerp(58, 47, k);
  const h = lerp(31, 25, k);
  const O = [0, 15, 0];
  const C = [O[0] + dist * Math.sin(az), O[1] + dist * Math.cos(az), h];
  const T = [0, 11, 6.5];
  let f = norm(sub(T, C)), r = norm(cross(f, [0, 0, 1])), u = cross(r, f);
  CAM = { C, f, r, u, focal: (H / 2) / Math.tan(30 * Math.PI / 180) };
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
function P(p) {
  const d = sub(p, CAM.C);
  const x = dot(d, CAM.r), y = dot(d, CAM.u), z = dot(d, CAM.f);
  return [W / 2 + x / z * CAM.focal, H / 2 + 60 - y / z * CAM.focal, z];
}

// ---------- court geometry (feet; baseline y=0, hoop at (0,5.25)) ----------
function arcPts(cx, cy, r, a0, a1, n = 64, z = 0) { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]); } return o; }
function linePts(a, b, n = 24) { const o = []; for (let i = 0; i <= n; i++) o.push([lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n), lerp(a[2] || 0, b[2] || 0, i / n)]); return o; }
const a3 = Math.acos(22 / 23.75);
const LINES = [
  { pts: [].concat(linePts([-25, 47], [-25, 0], 40), linePts([-25, 0], [25, 0], 40), linePts([25, 0], [25, 47], 40), linePts([25, 47], [-25, 47], 40)), t0: 0.35, t1: 1.35, w: 2.4 },
  { pts: [].concat(linePts([-8, 0], [-8, 19]), linePts([-8, 19], [8, 19]), linePts([8, 19], [8, 0])), t0: 0.65, t1: 1.25, w: 2.2 },
  { pts: arcPts(0, 19, 6, 0, Math.PI * 2, 72), t0: 0.85, t1: 1.45, w: 2 },
  { pts: [].concat(linePts([-22, 0], [-22, 14]), arcPts(0, 5.25, 23.75, Math.PI - a3, a3, 96), linePts([22, 14], [22, 0])), t0: 0.7, t1: 1.55, w: 2.4 },
  { pts: arcPts(0, 5.25, 4, Math.PI, 0, 32), t0: 1.0, t1: 1.4, w: 1.8 },
  { pts: arcPts(0, 47, 6, Math.PI, Math.PI * 2, 48), t0: 1.0, t1: 1.5, w: 2 },
];
const BOARD = [[-3, 4, 9], [3, 4, 9], [3, 4, 12.5], [-3, 4, 12.5], [-3, 4, 9]];
const HOOP = arcPts(0, 5.25, 0.75, 0, Math.PI * 2, 32, 10);
const HOOP_C = [0, 5.25, 10];

const OFF = [[19, 22], [-20, 6], [-4.5, 9], [-11, 27], [8, 30]];
const DEF = [[16, 19.5], [-17.5, 7.5], [-2, 7], [-9, 23.5], [6, 26]];
const PLAYERS = [];
OFF.forEach((p, i) => PLAYERS.push({ x: p[0], y: p[1], c: CYAN, t: 1.0 + i * 0.16, num: i === 0 ? '7' : '' }));
DEF.forEach((p, i) => PLAYERS.push({ x: p[0], y: p[1], c: ORANGE, t: 1.08 + i * 0.16, num: '' }));

// particles
const R = rng(7), PARTS = [];
for (let i = 0; i < 160; i++) PARTS.push({ x: R() * W, y: R() * H, s: 0.6 + R() * 2.2, v: 8 + R() * 30, ph: R() * 6.28, c: R() < 0.8 ? '160,235,255' : '255,170,110' });

// ---------- drawing ----------
function glowPath(pts, color, width, alpha, blur) {
  if (pts.length < 2) return;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); pts.forEach((p, i) => { const s = P(p); i ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1]); });
  g.shadowColor = color; g.shadowBlur = blur; g.lineWidth = width * 3; g.globalAlpha = alpha * 0.35; g.stroke();
  g.shadowBlur = blur * 0.5; g.lineWidth = width; g.globalAlpha = alpha; g.stroke();
  g.shadowBlur = 0; g.strokeStyle = 'rgba(235,252,255,0.9)'; g.lineWidth = width * 0.4; g.stroke();
  g.restore();
}
function partial(pts, p) { if (p <= 0) return []; const n = Math.max(2, Math.ceil(pts.length * p)); return pts.slice(0, Math.min(n, pts.length)); }

function drawBackground(t) {
  const gr = g.createRadialGradient(W / 2, H * 0.55, 50, W / 2, H * 0.55, W * 0.75);
  gr.addColorStop(0, '#0b2233'); gr.addColorStop(0.55, '#06121d'); gr.addColorStop(1, '#010409');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // perspective floor grid
  g.save(); g.globalAlpha = 0.10 * prog(t, 0.1, 0.8);
  g.strokeStyle = CYAN; g.lineWidth = 1;
  for (let x = -60; x <= 60; x += 6) { const a = P([x, -20, 0]), b = P([x, 90, 0]); if (a[2] > 1 && b[2] > 1) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } }
  const off = (t * 4) % 6;
  for (let y = -18; y <= 90; y += 6) { const yy = y + off; const a = P([-60, yy, 0]), b = P([60, yy, 0]); if (a[2] > 1 && b[2] > 1) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } }
  g.restore();
}

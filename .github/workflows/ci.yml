name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADK_LLM_PROVIDER: none      # never call a paid model in CI
      ADK_VOICE: none
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: install (CPU torch, no weights)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: lint
        run: ruff check agentdunker/*.py tests tools
      - name: release scan (secrets, footage, weights, large files, history)
        run: python tools/release_scan.py
      - name: synced modules match their pins
        if: false   # needs the module worktrees; run locally: python tools/sync_modules.py --check
        run: python tools/sync_modules.py --check
      - name: tests (unit + synthetic smoke)
        run: pytest -q
